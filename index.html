<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeyHub — Get your key</title>
<style>
  :root { --bg:#0f1117; --card:#161a24; --line:#232838; --text:#e6e9f0; --muted:#8b93a7; --green:#22c55e; --blue:#6366f1; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #1c2233, var(--bg)); color:var(--text);
         font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:min(760px,100%); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .top { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  h1 { margin:0 0 10px; font-size:20px; }
  .providers { display:flex; gap:8px; flex-wrap:wrap; }
  .prov { background:#1e2330; color:var(--muted); border:1px solid var(--line); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:12px; }
  .prov.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .grow { flex:1; min-width:220px; }
  .progressLabel { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .bar { height:10px; background:#0b0e14; border-radius:999px; overflow:hidden; border:1px solid var(--line); }
  .bar > div { height:100%; width:0%; background:linear-gradient(90deg,var(--green),#4ade80); transition:width .35s ease; }
  button.primary { background:var(--green); color:#04120a; border:0; font-weight:700; padding:14px 22px; border-radius:12px; cursor:pointer; font-size:14px; }
  button.primary:disabled { opacity:.35; cursor:not-allowed; }
  .keys { margin-top:22px; border-top:1px solid var(--line); padding-top:16px; }
  .keysHeader, .keyRow { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; font-size:12px; }
  .keysHeader { color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .keyRow { font-size:14px; font-family:ui-monospace,Consolas,monospace; }
  .getKey { margin-top:18px; width:100%; background:transparent; color:var(--blue); border:1px solid var(--blue); padding:14px; border-radius:12px; cursor:pointer; font-weight:600; }
  .getKey:disabled { opacity:.35; cursor:not-allowed; }
  .msg { min-height:20px; margin-top:14px; font-size:13px; color:var(--muted); }
  .msg.ok { color:var(--green); }
  .msg.err { color:#f87171; }
  .hint { margin-top:6px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="grow">
        <h1 id="title">Get your key</h1>
        <div class="providers" id="providers"></div>
      </div>
      <div class="grow">
        <div class="progressLabel">Progress: <span id="prog">0/2</span></div>
        <div class="bar"><div id="bar"></div></div>
      </div>
      <button id="start" class="primary">▶ START</button>
    </div>

    <div class="keys">
      <div class="keysHeader"><span>Your key</span><span>Time left</span><span>Status</span></div>
      <div class="keyRow"><span id="keyVal">—</span><span id="timeLeft">—</span><span id="status">no key yet</span></div>
    </div>

    <button id="getKey" class="getKey" disabled>+ GET A NEW KEY</button>
    <div id="msg" class="msg"></div>
    <div class="hint"><a href="#" id="reset" style="color:#6366f1">Reset session</a> · Progress saves automatically — you can close this page and come back.</div>
  </div>

<script src="config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const API = (window.KEYHUB_API || "").replace(/\/+$/, "");
  const absolute = (u) => (u && u[0] === "/" ? API + u : u);
  const LS_TOKEN = "keyhub_token";
  const LS_PROVIDER = "keyhub_provider";

  let cfg = { steps: 2, providers: [], key_hours: 24 };
  let provider = null, token = null, stepUrl = null, timer = null, hasKey = false;

  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };

  async function jget(path) { return (await fetch(API + path)).json(); }
  async function jpost(path, body) {
    const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    return r.json();
  }
  function show(text, kind) { const m = $("msg"); m.textContent = text || ""; m.className = "msg" + (kind ? " " + kind : ""); }
  function updateProgress(done) {
    const req = cfg.steps || 2;
    $("prog").textContent = done + "/" + req;
    $("bar").style.width = Math.min(100, (done / req) * 100) + "%";
  }
  function showKey(key, hours) {
    $("keyVal").textContent = key;
    $("timeLeft").textContent = (hours || cfg.key_hours || 24) + "h";
    $("status").textContent = "active";
  }

  function renderProviders() {
    const box = $("providers");
    box.innerHTML = "";
    if (!cfg.providers || cfg.providers.length <= 1) { provider = (cfg.providers || [])[0] || "lootlabs"; return; }
    cfg.providers.forEach((p) => {
      const b = document.createElement("button");
      b.textContent = p;
      b.className = "prov";
      b.dataset.provider = p;
      b.onclick = () => setProvider(p);
      box.appendChild(b);
    });
  }
  function highlightProvider() {
    document.querySelectorAll(".prov").forEach((el) => el.classList.toggle("active", el.dataset.provider === provider));
  }
  function setProvider(p) {
    provider = p;
    lsSet(LS_PROVIDER, p);
    highlightProvider();
    check();   // same session -> progress is kept; only the ad link changes
  }

  async function check() {
    if (!token) return false;
    const s = await jget("/api/v1/ad/status?token=" + encodeURIComponent(token) + "&provider=" + encodeURIComponent(provider || ""));
    if (!s.success) {
      token = null; stepUrl = null; lsSet(LS_TOKEN, null);
      $("start").disabled = false; $("getKey").disabled = true;
      $("start").textContent = "▶ START";
      $("status").textContent = "session expired — press START";
      return false;
    }
    stepUrl = s.step_url || stepUrl;
    if (s.provider) { provider = provider || s.provider; highlightProvider(); }
    updateProgress(s.steps_done);
    hasKey = !!s.key;
    if (s.key) showKey(s.key, s.key_hours);
    const done = s.steps_done >= s.steps_required;
    $("start").disabled = done;
    $("getKey").disabled = !(done || hasKey);
    $("getKey").textContent = hasKey ? "↻ GET ANOTHER KEY" : "+ GET A NEW KEY";
    $("start").textContent = done ? "✔ DONE" : (s.steps_done > 0 ? "▶ CONTINUE (" + s.steps_done + "/" + s.steps_required + ")" : "▶ START");
    return true;
  }

  function poll() { if (timer) clearInterval(timer); check(); timer = setInterval(check, 2500); }

  async function start() {
    if (!token) {
      const data = await jpost("/api/v1/ad/session", { provider: provider });
      if (!data.success) { show(data.message || "Could not start", "err"); return; }
      token = data.token; lsSet(LS_TOKEN, token);
    }
    await check();
    if (stepUrl) window.open(absolute(stepUrl), "_blank");
    show("Complete the task in the new tab. Progress updates automatically.");
    poll();
  }

  async function newSession() {
    token = null; stepUrl = null; hasKey = false; lsSet(LS_TOKEN, null);
    const data = await jpost("/api/v1/ad/session", { provider: provider });
    if (!data.success) { show(data.message || "Could not start", "err"); return; }
    token = data.token; lsSet(LS_TOKEN, token);
    $("keyVal").textContent = "—"; $("timeLeft").textContent = "—"; $("status").textContent = "no key yet";
    updateProgress(0);
    $("start").disabled = false; $("start").textContent = "▶ START";
    $("getKey").disabled = true; $("getKey").textContent = "+ GET A NEW KEY";
    show("New session started — press START.");
  }

  async function getKey() {
    if (hasKey || !token) { await newSession(); return; }   // already have one -> start fresh for another
    const data = await jpost("/api/v1/ad/claim", { token: token });
    if (!data.success) { show(data.message || "Complete all steps first.", "err"); await check(); return; }
    hasKey = true;
    showKey(data.key, data.hours);
    $("getKey").textContent = "↻ GET ANOTHER KEY";
    try { await navigator.clipboard.writeText(data.key); show("Key copied to clipboard. Paste it in the script.", "ok"); }
    catch (e) { show("Your key: " + data.key, "ok"); }
  }

  async function resetSession() {
    token = null; stepUrl = null; hasKey = false; lsSet(LS_TOKEN, null); lsSet(LS_PROVIDER, null);
    if (timer) clearInterval(timer);
    $("keyVal").textContent = "—"; $("timeLeft").textContent = "—"; $("status").textContent = "no key yet";
    updateProgress(0);
    $("start").disabled = false; $("start").textContent = "▶ START";
    $("getKey").disabled = true; $("getKey").textContent = "+ GET A NEW KEY";
    show("Session cleared. Press START to begin again.");
  }

  $("start").onclick = start;
  $("getKey").onclick = getKey;
  $("reset").onclick = resetSession;

  (async () => {
    cfg = await jget("/api/v1/ad/config");
    $("title").textContent = cfg.title || window.KEYHUB_TITLE || "Get your key";
    renderProviders();
    const savedProvider = lsGet(LS_PROVIDER);
    provider = (savedProvider && (cfg.providers || []).includes(savedProvider)) ? savedProvider : ((cfg.providers || [])[0] || "lootlabs");
    highlightProvider();
    updateProgress(0);

    token = lsGet(LS_TOKEN) || null;            // resume the previous session
    if (token) {
      const alive = await check();
      if (alive) { poll(); show("Resumed your saved progress."); }
    }
    if (!cfg.enabled) show("Ad system is disabled on the server.", "err");
  })();
</script>
</body>
</html>
