<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeyHub — Get your key</title>
<style>
  :root { --bg:#0f1117; --card:#161a24; --line:#232838; --text:#e6e9f0; --muted:#8b93a7; --green:#22c55e; --blue:#6366f1; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #1c2233, var(--bg)); color:var(--text);
         font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:min(760px,100%); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .top { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  h1 { margin:0 0 10px; font-size:20px; }
  .providers { display:flex; gap:8px; flex-wrap:wrap; }
  .prov { background:#1e2330; color:var(--muted); border:1px solid var(--line); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:12px; }
  .prov.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .grow { flex:1; min-width:220px; }
  .progressLabel { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .bar { height:10px; background:#0b0e14; border-radius:999px; overflow:hidden; border:1px solid var(--line); }
  .bar > div { height:100%; width:0%; background:linear-gradient(90deg,var(--green),#4ade80); transition:width .35s ease; }
  button.primary { background:var(--green); color:#04120a; border:0; font-weight:700; padding:14px 22px; border-radius:12px; cursor:pointer; font-size:14px; }
  button.primary:disabled { opacity:.35; cursor:not-allowed; }
  .keys { margin-top:22px; border-top:1px solid var(--line); padding-top:16px; }
  .keysHeader, .keyRow { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; font-size:12px; }
  .keysHeader { color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .keyRow { font-size:14px; font-family:ui-monospace,Consolas,monospace; }
  .getKey { margin-top:18px; width:100%; background:transparent; color:var(--blue); border:1px solid var(--blue); padding:14px; border-radius:12px; cursor:pointer; font-weight:600; }
  .getKey:disabled { opacity:.35; cursor:not-allowed; }
  .msg { min-height:20px; margin-top:14px; font-size:13px; color:var(--muted); }
  .msg.ok { color:var(--green); }
  .msg.err { color:#f87171; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="grow">
        <h1 id="title">Get your key</h1>
        <div class="providers" id="providers"></div>
      </div>
      <div class="grow">
        <div class="progressLabel">Progress: <span id="prog">0/2</span></div>
        <div class="bar"><div id="bar"></div></div>
      </div>
      <button id="start" class="primary">▶ START</button>
    </div>

    <div class="keys">
      <div class="keysHeader"><span>Your key</span><span>Time left</span><span>Status</span></div>
      <div class="keyRow"><span id="keyVal">—</span><span id="timeLeft">—</span><span id="status">no key yet</span></div>
    </div>

    <button id="getKey" class="getKey" disabled>+ GET A NEW KEY</button>
    <div id="msg" class="msg"></div>
  </div>

<script src="config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const API = (window.KEYHUB_API || "").replace(/\/+$/, "");
  const absolute = (u) => (u && u[0] === "/" ? API + u : u);
  let cfg = { steps: 2, providers: [], key_hours: 24 }, provider = "lootlabs";
  let token = null, stepUrl = null, timer = null;

  async function jget(path) { return (await fetch(API + path)).json(); }
  async function jpost(path, body) {
    const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    return r.json();
  }
  function show(text, kind) { const m = $("msg"); m.textContent = text || ""; m.className = "msg" + (kind ? " " + kind : ""); }

  function renderProviders() {
    const box = $("providers"); box.innerHTML = "";
    if (!cfg.providers || cfg.providers.length <= 1) return;
    cfg.providers.forEach((p, i) => {
      const b = document.createElement("button");
      b.textContent = p; b.className = "prov" + (i === 0 ? " active" : "");
      b.onclick = () => { provider = p; token = null; stepUrl = null; $("keyVal").textContent = "—"; $("timeLeft").textContent = "—";
        $("status").textContent = "no key yet"; $("getKey").disabled = true; $("start").disabled = false;
        document.querySelectorAll(".prov").forEach((x) => x.classList.remove("active")); b.classList.add("active"); updateProgress(0); };
      box.appendChild(b);
    });
    provider = cfg.providers[0];
  }
  function updateProgress(done) {
    const req = cfg.steps || 2;
    $("prog").textContent = done + "/" + req;
    $("bar").style.width = Math.min(100, (done / req) * 100) + "%";
  }
  async function start() {
    if (!token) {
      const data = await jpost("/api/v1/ad/session", { provider: provider });
      if (!data.success) { show(data.message || "Could not start", "err"); return; }
      token = data.token; stepUrl = data.step_url;
    }
    if (stepUrl) window.open(absolute(stepUrl), "_blank");
    show("Complete the task, progress updates automatically.");
    poll();
  }
  async function check() {
    if (!token) return;
    const s = await jget("/api/v1/ad/status?token=" + encodeURIComponent(token));
    if (!s.success) { $("status").textContent = "session expired"; return; }
    stepUrl = s.step_url || stepUrl;
    updateProgress(s.steps_done);
    if (s.key) { $("keyVal").textContent = s.key; $("timeLeft").textContent = s.key_hours + "h"; $("status").textContent = "active"; $("getKey").disabled = true; }
    const done = s.steps_done >= s.steps_required;
    $("start").disabled = done;
    $("getKey").disabled = !done;
    $("start").textContent = done ? "✔ DONE" : "▶ CONTINUE (" + s.steps_done + "/" + s.steps_required + ")";
    if (s.expired) $("status").textContent = "expired — start again";
  }
  function poll() { if (timer) clearInterval(timer); check(); timer = setInterval(check, 2500); }
  async function getKey() {
    if (!token) { show("Press START first.", "err"); return; }
    const data = await jpost("/api/v1/ad/claim", { token: token });
    if (!data.success) { show(data.message || "Complete all steps first.", "err"); await check(); return; }
    $("keyVal").textContent = data.key; $("timeLeft").textContent = (data.hours || 24) + "h"; $("status").textContent = "active";
    $("getKey").disabled = true;
    try { await navigator.clipboard.writeText(data.key); show("Key copied to clipboard. Paste it in the script.", "ok"); }
    catch (e) { show("Your key: " + data.key, "ok"); }
  }

  $("start").onclick = start;
  $("getKey").onclick = getKey;
  (async () => {
    cfg = await jget("/api/v1/ad/config");
    $("title").textContent = cfg.title || window.KEYHUB_TITLE || "Get your key";
    renderProviders();
    const t = new URLSearchParams(location.search).get("t");
    if (t) { token = t; poll(); }
    updateProgress(0);
    if (!cfg.enabled) show("Ad system is disabled on the server.", "err");
  })();
</script>
</body>
</html>
